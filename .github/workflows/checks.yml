name: Public portfolio checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.130.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified Gitleaks
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml'

  quality:
    name: Test, lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  required:
    name: All checks passed
    needs: [semgrep, gitleaks, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SEMGREP: ${{ needs.semgrep.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          QUALITY: ${{ needs.quality.result }}
        run: test "$SEMGREP" = success && test "$GITLEAKS" = success && test "$QUALITY" = success

# This portfolio repository deliberately has no deployment job.
